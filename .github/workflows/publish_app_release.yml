name: livehub-windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v2.0.3"
        required: true
        default: "v2.0.3"
      create_release:
        description: "Upload build outputs to a GitHub Release"
        type: boolean
        default: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore Packages
        run: |
          cd livehub_app
          flutter pub get

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build Windows
        run: |
          cd livehub_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean

      - name: Upload Windows App to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            livehub_app/build/dist/*/*.msix
            livehub_app/build/dist/*/*.zip

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag_name }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Upload Release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            livehub_app/build/dist/*/*.msix
            livehub_app/build/dist/*/*.zip
